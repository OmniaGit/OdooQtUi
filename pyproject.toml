[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OdooQtUi"
dynamic = ["version"]
description = "Native PySide6 desktop applications on top of Odoo: form, list and search views rendered from the server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Daniel Smerghetto" },
    { name = "Matteo Boscolo" },
    { name = "OmniaSolutions", email = "daniel.smerghetto@omniasolutions.eu" },
]
keywords = ["odoo", "qt", "pyside6", "desktop", "erp", "xmlrpc", "jsonrpc", "gui", "widgets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Framework :: Odoo",
    "Framework :: Odoo :: 19.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "PySide6",
    "python-dateutil",
    "requests",
]

[project.urls]
Homepage = "https://github.com/OmniaGit/OdooQtUi"
Source = "https://github.com/OmniaGit/OdooQtUi"
Issues = "https://github.com/OmniaGit/OdooQtUi/issues"
Changelog = "https://github.com/OmniaGit/OdooQtUi/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "OdooQtUi.__version__" }

[tool.setuptools.packages.find]
# Only the library itself: OmniaQt, OdooQtUiWeb and the tests live in this
# repository but are not part of what is published.
include = ["OdooQtUi", "OdooQtUi.*"]

[tool.setuptools.package-data]
OdooQtUi = ["images/*.png", "interface/ui/*.ui"]
