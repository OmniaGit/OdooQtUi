# Publish a release to PyPI when a version tag is pushed:
#
#     git tag v0.1.0 && git push github v0.1.0
#
# The tag must match OdooQtUi.__version__. PyPI is reached through Trusted
# Publishing: no password or token is stored in GitHub. On pypi.org, project
# OdooQtUi -> Manage -> Publishing, add a GitHub publisher with
#     owner OmniaGit, repository OdooQtUi, workflow release.yml, environment pypi
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the version in the package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('OdooQtUi/__init__.py').read()).group(1))")
          echo "tag $tag, package $version"
          test "$tag" = "$version"

      - name: Libraries Qt needs without a display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s test -p "test_*.py"

      - name: Links of the PyPI page pinned to this tag
        # The README is the PyPI page: its images and links name a branch, and a
        # release page must keep showing the pictures of its own version.
        run: |
          sed -i "s#raw.githubusercontent.com/OmniaGit/OdooQtUi/[^/]*/#raw.githubusercontent.com/OmniaGit/OdooQtUi/${GITHUB_REF_NAME}/#g; s#github.com/OmniaGit/OdooQtUi/blob/[^/]*/#github.com/OmniaGit/OdooQtUi/blob/${GITHUB_REF_NAME}/#g" README.md pyproject.toml
          grep -n "githubusercontent\|/blob/" README.md pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/OdooQtUi/
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "OdooQtUi $GITHUB_REF_NAME" --notes-file notes.md
